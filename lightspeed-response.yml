- name: Remediate httpd configuration issue on the affected host
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    httpd_service_name: httpd
  tasks:
  - name: Check if a backup of the httpd config already exists
    ansible.builtin.stat:
      path: '{{ httpd_conf_path }}.bak'
    register: backup_stat
  - name: Create a backup of the current httpd configuration (if not present)
    ansible.builtin.copy:
      src: '{{ httpd_conf_path }}'
      dest: '{{ httpd_conf_path }}.bak'
      remote_src: true
      mode: preserve
    when: not backup_stat.stat.exists
  - name: Remove any occurrence of the invalid directive from the httpd configuration
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^\s*{{ invalid_directive }}\b
      state: absent
      backup: false
    notify: Restart httpd
  - name: Ensure the httpd service is enabled and running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      enabled: true
      state: started
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_config_file }}'
    register: httpd_config_file_stat
  - name: Remove invalid directive from httpd configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: InvalidDirectiveHere
      state: absent
    when: httpd_config_file_stat.stat.exists
  - name: Validate httpd configuration file syntax
    ansible.builtin.command: httpd -t
    register: httpd_config_test
    changed_when: false
  - name: Restart httpd service if configuration file has changed
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
    when: httpd_config_test.rc != 0 or httpd_config_file_stat.changed
  - name: Verify httpd service status
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
    register: httpd_service_status
  - name: Ensure httpd service logs are not reporting errors
    ansible.builtin.command: journalctl -u {{ httpd_service_name }} | grep -q 'error'
    register: httpd_service_errors
    changed_when: false
    failed_when: httpd_service_errors.rc == 0

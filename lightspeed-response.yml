- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd.conf exists
    ansible.builtin.stat:
      path: '{{ httpd_conf_path }}'
    register: httpd_conf_stat
  - name: Validate httpd.conf syntax
    ansible.builtin.command:
      cmd: httpd -t
    register: httpd_syntax_check
    failed_when: httpd_syntax_check.rc != 0
    changed_when: false
    become: true
  - name: Correct invalid directive in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '#InvalidDirectiveHere'
      regexp: ^InvalidDirectiveHere
      state: present
    register: httpd_conf_corrected
  - name: Restart httpd service if config was corrected
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
    when: httpd_conf_corrected is changed
    notify: Verify httpd service status
  - name: Verify httpd service status
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: Verify httpd service status
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true

- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_config_file }}'
    register: httpd_config_file_stat
  - name: Read httpd configuration file
    ansible.builtin.fetch:
      src: '{{ httpd_config_file }}'
      dest: /tmp
      flat: true
    register: httpd_config_file_fetch
    when: httpd_config_file_stat.stat.exists
  - name: Correct invalid directive in httpd configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: '# InvalidDirectiveHere'
      state: present
      create: true
    notify: restart httpd service
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

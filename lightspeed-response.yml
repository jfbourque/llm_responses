- name: Remediate httpd service issue on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_service: httpd
    httpd_conf: /etc/httpd/conf/httpd.conf
    mod_name: mod_module
    mod_file: /usr/lib/httpd/modules/mod_module.so
    mod_package: mod_module_pkg
    loadmodule_regex: ^LoadModule\s+{{ mod_name }}_module\s+modules/{{ mod_name }}\.so
  tasks:
  - name: Ensure the package providing the missing module is installed
    ansible.builtin.yum:
      name: '{{ mod_package }}'
      state: present
    register: yum_result
    notify: Restart httpd
  - name: Verify the required module file exists
    ansible.builtin.stat:
      path: '{{ mod_file }}'
    register: mod_stat
  - name: Fail if the module file is still missing after package installation
    ansible.builtin.fail:
      msg: Required module file {{ mod_file }} is missing on the host.
    when: not mod_stat.stat.exists
  - name: Remove (or comment out) the invalid LoadModule directive
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf }}'
      regexp: '{{ loadmodule_regex }}'
      state: absent
      backup: true
    notify: Restart httpd
  - name: Ensure httpd service is enabled and running
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: started
      enabled: true
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: restarted

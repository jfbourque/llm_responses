- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_config_file }}'
    register: config_file_stat
  - name: Validate httpd configuration file syntax
    ansible.builtin.command:
      cmd: httpd -t
    register: config_test
    failed_when: config_test.rc != 0
    changed_when: false
    ignore_errors: true
  - name: Correct invalid directive in httpd configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: '# Corrected directive or added comment to ignore invalid directive'
      insertafter: ^(.*line 35.*)$
      state: present
    when: config_test.rc != 0 and config_file_stat.stat.exists
  - name: Ensure httpd service is restarted on config change
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
    notify: restart httpd service
  handlers:
  - name: restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
  - name: Verify httpd service status
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true

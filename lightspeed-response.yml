- name: Remediate httpd configuration on the affected host
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
    vhost_port: 80
    server_name: www.example.com
    server_alias: example.com
    document_root: /var/www/html
    vhost_block_marker: '# BEGIN ANSIBLE MANAGED VIRTUALHOST'
    vhost_block_marker_end: '# END ANSIBLE MANAGED VIRTUALHOST'
  tasks:
  - name: Ensure a backup of the original httpd configuration exists
    ansible.builtin.copy:
      src: '{{ httpd_conf_path }}'
      dest: '{{ httpd_conf_path }}.bak_{{ ansible_date_time.iso8601_basic_short }}'
      remote_src: true
      mode: '0644'
    when: not httpd_conf_path is path('exists')
    tags: backup
  - name: Remove stray ServerAlias directives outside of a <VirtualHost> block
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^\s*ServerAlias\s+.*
      state: absent
    notify: Restart httpd
    tags: config
  - name: Ensure required VirtualHost block with ServerAlias is present
    ansible.builtin.blockinfile:
      path: '{{ httpd_conf_path }}'
      marker: '{{ item.marker }}'
      block: "<VirtualHost *:{{ vhost_port }}>\n    ServerName {{ server_name }}\n
        \   ServerAlias {{ server_alias }}\n    DocumentRoot \"{{ document_root }}\"\n
        \   # Additional directives can be added here\n</VirtualHost>\n"
    loop:
    - marker: '{{ vhost_block_marker }}'
    - marker: '{{ vhost_block_marker_end }}'
    notify: Restart httpd
    tags: config
  - name: Ensure httpd service is enabled and started
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      enabled: true
      state: started
    tags: service
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

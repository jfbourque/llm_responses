- name: Ansible 2.5 Playbook
  hosts: all
  become: true
  tasks:
  - name: Remove line from a file
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: ^InvalidDirectiveHere
      state: absent
  - name: Restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

- name: Remediate httpd service issue
  hosts: all
  become: true
  vars:
    config_file: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    correct_directive: Listen
  tasks:
  - name: Ensure config file exists
    ansible.builtin.file:
      path: '{{ config_file }}'
      state: file
      mode: '0644'
  - name: Check for invalid directive
    ansible.builtin.lineinfile:
      path: '{{ config_file }}'
      line: '{{ invalid_directive }}'
      state: absent
    register: config_change
  - name: Replace invalid directive with correct one
    ansible.builtin.lineinfile:
      path: '{{ config_file }}'
      line: '{{ correct_directive }} 80'
      insertafter: '{{ invalid_directive | default('''') }}'
      create: true
    when: config_change.changed
  - name: Restart httpd service
    ansible.builtin.service:
      name: httpd
      state: restarted
    handlers:
    - name: restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
  - name: Verify httpd service status
    ansible.builtin.service:
      name: httpd
      state: started
    register: httpd_status
  - name: Assert httpd service is running
    ansible.builtin.assert:
      that:
      - httpd_status.state == 'started'
      - httpd_status.enabled == 'enabled'

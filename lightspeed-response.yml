- name: Remediate Apache configuration issue on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    apache_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    apache_service_name: httpd
  tasks:
  - name: Ensure the invalid directive is absent from the Apache configuration
    ansible.builtin.lineinfile:
      path: '{{ apache_conf_path }}'
      regexp: ^[ \t]*{{ invalid_directive }}\b.*$
      state: absent
      backup: true
    notify: Restart Apache
  - name: Ensure Apache service is enabled and started
    ansible.builtin.service:
      name: '{{ apache_service_name }}'
      enabled: true
      state: started
  handlers:
  - name: Restart Apache
    ansible.builtin.service:
      name: '{{ apache_service_name }}'
      state: restarted

- name: Remediate httpd service configuration issue on RHEL server
  hosts: all
  become: true
  vars:
    override_conf_path: /etc/systemd/system/httpd.service.d/override.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if override.conf exists
    ansible.builtin.stat:
      path: '{{ override_conf_path }}'
    register: override_conf_stat
  - name: Review and correct override.conf
    ansible.builtin.lineinfile:
      path: '{{ override_conf_path }}'
      state: present
      line: ''
      regexp: ^[^\[\]]
      backrefs: true
    notify: restart httpd service
    when: override_conf_stat.stat.exists and override_conf_stat.stat.is_file
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: reloaded
  - name: Ensure httpd service is running and enabled
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd service
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: restarted

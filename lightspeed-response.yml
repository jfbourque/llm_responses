- name: Remediate httpd service issue on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    options_conf_path: /etc/systemd/system/httpd.service.d/options.conf
    httpd_service_name: httpd
  tasks:
  - name: Correct syntax error in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '# Correct or remove the invalid directive on line 35'
      insertafter: ^(.*line 35.*)$
      state: present
    notify: restart httpd
  - name: Ensure correct section in options.conf
    ansible.builtin.ini_file:
      path: '{{ options_conf_path }}'
      section: Service
      option: ExecStart
      value: ''
      state: present
  - name: Ensure httpd service is enabled and running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

- name: Remediate httpd service configuration issue on RHEL server
  hosts: all
  become: true
  vars:
    options_conf_path: /etc/systemd/system/httpd.service.d/options.conf
    httpd_service_name: httpd.service
  tasks:
  - name: Check if options.conf file exists
    ansible.builtin.stat:
      path: '{{ options_conf_path }}'
    register: options_conf_file
  - name: Review and correct configuration in options.conf
    ansible.builtin.lineinfile:
      path: '{{ options_conf_path }}'
      regexp: ^[^#].*?=[^=]*$
      line: '# \g<0>'
      state: present
      backrefs: true
    when: options_conf_file.stat.exists
  - name: Ensure correct section-based configuration
    ansible.builtin.blockinfile:
      path: '{{ options_conf_path }}'
      block: '[Service]

        ExecStart=/usr/sbin/httpd $OPTIONS

        '
      create: true
    when: options_conf_file.stat.exists
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      name: daemon-reload
      state: reloaded
  - name: Restart httpd service if changed
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
    register: httpd_service_restart
  - name: Verify httpd service status
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
    register: httpd_service_status
  handlers:
  - name: Restart httpd service
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true

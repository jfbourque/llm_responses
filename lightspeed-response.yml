- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_error_log: /var/log/httpd/error_log
  tasks:
  - name: Check and install required packages
    ansible.builtin.package:
      name: httpd
      state: present
  - name: Check and fix httpd configuration syntax errors
    ansible.builtin.command: httpd -t
    register: httpd_config_test
    failed_when: httpd_config_test.rc != 0
  - name: Check and fix httpd error log permissions
    ansible.builtin.file:
      path: '{{ httpd_error_log }}'
      owner: root
      group: root
      mode: '0644'
  - name: Check journal logs for httpd errors
    ansible.builtin.command: journalctl -u httpd
    register: httpd_journal_logs
  - name: Display httpd journal logs
    ansible.builtin.debug:
      msg: '{{ httpd_journal_logs.stdout }}'
  - name: Restart httpd service if configuration has changed
    ansible.builtin.service:
      name: httpd
      state: restarted
      enabled: true
    notify: restart httpd
  - name: Verify httpd service is running and enabled
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
    register: httpd_service_status
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted
      enabled: true

- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_config_file }}'
    register: httpd_config_file_stat
  - name: Validate httpd configuration file syntax
    ansible.builtin.command:
      cmd: httpd -t
    register: httpd_config_validation
    failed_when: httpd_config_validation.rc != 0
    changed_when: false
    become: true
  - name: Correct or remove invalid directive in httpd configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: InvalidDirectiveHere
      state: absent
    register: httpd_config_correction
  - name: Validate httpd configuration file syntax after correction
    ansible.builtin.command:
      cmd: httpd -t
    register: httpd_config_validation_after_correction
    failed_when: httpd_config_validation_after_correction.rc != 0
    changed_when: false
    become: true
  - name: Enable and start httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: Restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
    listen: httpd service restart

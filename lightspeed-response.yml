- name: Remediate Apache httpd service failure
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    httpd_service_name: httpd
  tasks:
  - name: Ensure invalid directive is absent from Apache configuration
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^[ \t]*{{ invalid_directive }}\b
      state: absent
      backup: true
    notify: Restart httpd
  - name: Ensure httpd service is enabled and started
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      enabled: true
      state: started
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

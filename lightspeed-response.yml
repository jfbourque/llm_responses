- name: Remediate Apache httpd.service startup failure
  hosts: all
  become: true
  vars:
    httpd_service_name: httpd
    httpd_main_conf: /etc/httpd/conf/httpd.conf
    httpd_conf_dir: /etc/httpd/conf.d
    invalid_directive: InvalidDirectiveHere
  tasks:
  - name: Gather list of additional Apache configuration files
    ansible.builtin.find:
      paths: '{{ httpd_conf_dir }}'
      patterns: '*.conf'
      recurse: true
    register: apache_conf_find
  - name: Build list of configuration files to inspect
    ansible.builtin.set_fact:
      apache_config_paths: '{{ [httpd_main_conf] + apache_conf_find.files | map(attribute=''path'')
        | list }}'
  - name: Comment out invalid directive in Apache configuration files
    ansible.builtin.lineinfile:
      path: '{{ item }}'
      regexp: ^(\s*){{ invalid_directive }}\b
      line: \1# {{ invalid_directive }}
      backrefs: true
      state: present
    loop: '{{ apache_config_paths }}'
    notify: Restart {{ httpd_service_name }}
  - name: Ensure {{ httpd_service_name }} service is enabled and started
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: Restart {{ httpd_service_name }}
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

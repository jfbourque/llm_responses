- name: Remediate Apache HTTPD configuration issue on the affected host
  hosts: all
  become: true
  gather_facts: false
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
  tasks:
  - name: Remove the invalid Apache directive from the configuration
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^\\s*{{ invalid_directive }}\\b
      state: absent
      backup: true
    notify: Restart httpd
  - name: Ensure the httpd service is enabled and running
    ansible.builtin.service:
      name: httpd
      enabled: true
      state: started
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

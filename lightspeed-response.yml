- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    replacement_directive: '# Correct directive or comment out'
  tasks:
  - name: Correct the configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: '{{ replacement_directive }}'
      regexp: '{{ invalid_directive }}'
      state: present
    notify: restart httpd
  - name: Ensure httpd service is started and enabled
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

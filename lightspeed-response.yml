- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Correct the configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '# InvalidDirectiveHere'
      state: present
      create: false
  - name: Remove invalid directive from configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^InvalidDirectiveHere
      line: '# Removed InvalidDirectiveHere'
      state: present
      backrefs: true
  - name: Ensure required modules are included in server configuration
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: LoadModule required_module modules/mod_required.so
      state: present
      create: false
    notify: restart httpd service
  - name: Verify and correct ServerAlias directive
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^ServerAlias
      line: ServerAlias example.com
      state: present
      backrefs: true
  - name: Check if httpd service is running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

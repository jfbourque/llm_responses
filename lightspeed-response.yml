- name: Remediate Apache httpd service failure due to invalid directive
  hosts: all
  become: true
  vars:
    httpd_service_name: httpd
    httpd_main_conf: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
  tasks:
  - name: Ensure the invalid directive is removed from the main httpd configuration
    ansible.builtin.lineinfile:
      path: '{{ httpd_main_conf }}'
      regexp: ^\s*{{ invalid_directive }}\b
      state: absent
    notify: Restart {{ httpd_service_name }}
  - name: Ensure the httpd service is enabled and started
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      enabled: true
      state: started
  handlers:
  - name: Restart {{ httpd_service_name }}
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

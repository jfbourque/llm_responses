- name: Remediate httpd service issue on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    options_conf_path: /etc/systemd/system/httpd.service.d/options.conf
  tasks:
  - name: Correct syntax error in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '# InvalidDirectiveHere'
      state: absent
      backrefs: true
  - name: Correct syntax error in options.conf
    ansible.builtin.replace:
      path: '{{ options_conf_path }}'
      regexp: ^.*Assignment outside of section.*$
      replace: ''
  - name: Ensure httpd service is restarted if config changes
    ansible.builtin.service:
      name: httpd
      state: restarted
      enabled: true
      daemon_reload: true
    notify: restart httpd
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted
      enabled: true
  - name: Verify httpd service status
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true

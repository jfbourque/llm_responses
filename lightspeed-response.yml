- name: Remediate httpd service issue on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd.conf exists
    ansible.builtin.stat:
      path: '{{ httpd_conf_path }}'
    register: httpd_conf_stat
  - name: Read httpd.conf and correct invalid directive
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '# InvalidDirectiveHere'
      state: present
      create: false
    when: httpd_conf_stat.stat.exists
  - name: Ensure correct directive is present or add a default one
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^Listen
      line: Listen 80
      state: present
      backrefs: true
    when: httpd_conf_stat.stat.exists
  - name: Enable and start httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: Restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
    listen: restart httpd
  - name: Check httpd service status
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true

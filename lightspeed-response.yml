- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_config_file }}'
    register: config_file_stat
  - name: Validate httpd configuration file syntax
    ansible.builtin.command:
      cmd: httpd -t
    register: config_validation
    failed_when: config_validation.rc != 0
    changed_when: false
  - name: Correct syntax error in httpd configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: '# InvalidDirectiveHere'
      regexp: ^InvalidDirectiveHere
      state: absent
    notify: restart httpd service
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

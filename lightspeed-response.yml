- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_dir: /etc/httpd
    httpd_conf_dir: '{{ httpd_config_dir }}/conf'
    httpd_conf_d_dir: '{{ httpd_config_dir }}/conf.d'
    httpd_log_dir: /var/log/httpd
  tasks:
  - name: Check if httpd is installed
    ansible.builtin.package:
      name: httpd
      state: present
  - name: Enable and start httpd service
    ansible.builtin.systemd:
      name: httpd
      state: started
      enabled: true
  - name: Check httpd service status
    ansible.builtin.systemd:
      name: httpd
      state: started
    register: httpd_status
  - name: Check for configuration errors
    ansible.builtin.command:
      cmd: apachectl configtest
    register: httpd_config_test
    failed_when: httpd_config_test.rc != 0 and httpd_config_test.rc != 4
  - name: Review and fix configuration files if needed
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
    - '{{ httpd_conf_dir }}'
    - '{{ httpd_conf_d_dir }}'
  - name: Ensure log directories exist
    ansible.builtin.file:
      path: '{{ httpd_log_dir }}'
      state: directory
      mode: '0755'
  - name: Restart httpd service if config has changed
    ansible.builtin.service:
      name: httpd
      state: restarted
    when: httpd_config_test.changed
    notify: restart httpd
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

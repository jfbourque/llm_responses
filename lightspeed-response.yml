- name: Remediate Apache httpd service on RHEL host
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
  tasks:
  - name: Comment out invalid directive in httpd configuration
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^\s*{{ invalid_directive }}\b
      line: '# {{ invalid_directive }} # Commented by Ansible remediation'
      state: present
    notify: Restart httpd
  - name: Ensure httpd service is started and enabled
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted
      enabled: true

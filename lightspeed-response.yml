- name: meeting the become requirement
  hosts: all
  become: true
  tasks:
  - name: remove the invalid login directive
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: ^InvalidDirectiveHere
      state: absent
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restart

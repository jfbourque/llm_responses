- name: Ansible Exercise 1A
  hosts: all
  become: true
  tasks:
  - name: RemoveLnk
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: ^InvalidDirectiveHere
      state: absent
  - name: RestartHttpd
    ansible.builtin.service:
      name: httpd
      state: restarted

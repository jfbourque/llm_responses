- name: Remediate Apache configuration issue on the affected host
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    httpd_service_name: httpd
  tasks:
  - name: Remove any occurrences of the invalid directive from the Apache config
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^[\s]*{{ invalid_directive }}\b
      state: absent
      backup: true
    notify: Restart httpd
  - name: Ensure the Apache service is enabled and running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      enabled: true
      state: started
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

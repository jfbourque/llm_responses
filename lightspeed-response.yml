- name: A simple playbook to remove a file
  hosts: all
  become: true
  tasks:
  - name: Remove a file
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: InvalidDirectiveHere
      state: absent
  - name: Restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

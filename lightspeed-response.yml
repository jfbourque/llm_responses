- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_conf_path }}'
    register: httpd_conf_file
  - name: Remove or comment out invalid directive from httpd configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '{{ invalid_directive }}'
      state: absent
    when: httpd_conf_file.stat.exists
  - name: Validate httpd configuration file syntax
    ansible.builtin.command:
      cmd: httpd -t
    register: httpd_config_test
    changed_when: false
  - name: Restart httpd service if configuration file syntax is valid
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
    when: httpd_config_test.rc == 0
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true

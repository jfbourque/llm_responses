- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    invalid_directive_line: 35
    invalid_directive: InvalidDirectiveHere
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_config_file }}'
    register: config_file_stat
  - name: Remove invalid directive from httpd configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: '{{ invalid_directive }}'
      state: absent
      backup: true
    when: config_file_stat.stat.exists and config_file_stat.stat.is_file
  - name: Validate httpd configuration syntax
    ansible.builtin.command: httpd -t
    register: httpd_syntax_check
    changed_when: false
  - name: Restart httpd service if configuration has changed
    ansible.builtin.service:
      name: httpd
      state: restarted
    notify: restart httpd
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  - name: Verify httpd service status
    ansible.builtin.service:
      name: httpd
    register: httpd_status
    changed_when: false

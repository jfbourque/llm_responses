- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Correct httpd configuration
    ansible.builtin.replace:
      path: '{{ httpd_config_file }}'
      regexp: InvalidDirectiveHere
      replace: '# InvalidDirectiveHere # Corrected'
    notify: restart httpd
    check_mode: true
  - name: Verify httpd configuration syntax
    ansible.builtin.command: apachectl configtest
    register: config_test
    changed_when: false
  - name: Fail if httpd configuration test failed
    ansible.builtin.fail:
      msg: 'httpd configuration test failed: {{ config_test.stdout }}'
    when: '''Syntax OK'' not in config_test.stdout'
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true

- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    override_conf_path: /etc/systemd/system/httpd.service.d/override.conf
    httpd_service_name: httpd
  tasks:
  - name: Remove problematic override.conf file
    ansible.builtin.file:
      path: '{{ override_conf_path }}'
      state: absent
  - name: Reload systemd configuration
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: reloaded
  - name: Restart httpd service if it's running
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
  - name: Ensure httpd service is enabled and running
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd service
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: restarted

- name: Remediate Apache configuration issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    httpd_service_name: httpd
  tasks:
  - name: Remove invalid Apache directive from configuration
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^\s*{{ invalid_directive }}\b.*
      state: absent
    notify: Restart Apache
  - name: Ensure Apache service is enabled and started
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      enabled: true
      state: started
  handlers:
  - name: Restart Apache
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

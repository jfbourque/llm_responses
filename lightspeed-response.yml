- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_service_name: httpd
    reboot_required: false
  tasks:
  - name: Check and restart systemd
    ansible.builtin.systemd:
      name: systemd
      state: restarted
      enabled: true
  - name: Verify httpd service existence
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
    register: httpd_service_status
    ignore_errors: true
  - name: Enable httpd service if not already enabled
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
    when: httpd_service_status is failed
  - name: Check for pending updates and upgrade system
    ansible.builtin.yum:
      update_cache: true
      upgrade: true
    register: system_update
  - name: Reboot system if updates were applied
    ansible.builtin.reboot:
      msg: Rebooting to apply updates.
      connect_timeout: 5
      reboot_timeout: 300
      pre_reboot_delay: 0
      post_reboot_delay: 60
      test_command: uptime
    when: system_update is changed
  - name: Verify httpd service is running and enabled after remediation
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  - name: Validate DNS resolution
    ansible.builtin.ping:
      name: arduino.jfbourque.ca
    register: dns_resolution_test
  - name: Fail if DNS resolution test fails
    ansible.builtin.fail:
      msg: DNS resolution test failed.
    when: dns_resolution_test is failed
  handlers:
  - name: restart httpd service
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: restarted

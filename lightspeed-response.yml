- name: Remediate Apache httpd service failure
  hosts: all
  become: true
  vars:
    httpd_conf_dir: /etc/httpd/conf.d
    invalid_directive: InvalidDirectiveHere
    httpd_service_name: httpd
    httpd_conf_backup: true
  tasks:
  - name: Find Apache configuration files
    ansible.builtin.find:
      paths: '{{ httpd_conf_dir }}'
      patterns: '*.conf'
      recurse: true
    register: httpd_conf_files
    tags: always
  - name: Remove or comment out the invalid directive
    ansible.builtin.replace:
      path: '{{ item.path }}'
      regexp: ^\s*{{ invalid_directive }}\b.*$
      replace: '# {{ invalid_directive }} removed by Ansible'
      backup: '{{ httpd_conf_backup }}'
    loop: '{{ httpd_conf_files.files }}'
    notify: Restart httpd
    tags: remediation
  - name: Ensure httpd service is enabled and started
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
    tags: service
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

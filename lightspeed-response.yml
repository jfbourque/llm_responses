- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_service_name: httpd
    sshd_service_name: sshd
  tasks:
  - name: Ensure sshd service is running and enabled
    ansible.builtin.service:
      name: '{{ sshd_service_name }}'
      state: started
      enabled: true
  - name: Verify network connectivity by pinging a known host
    ansible.builtin.ping:
      timeout: 10
  - name: Check if httpd service is running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
    register: httpd_status
  - name: Restart httpd service if it's not running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
    when: httpd_status is changed or httpd_status is not defined
  - name: Ensure firewall allows http and https traffic
    ansible.builtin.firewalld:
      zone: public
      service: '{{ item }}'
      state: enabled
      permanent: true
    loop:
    - http
    - https
    notify: reload firewalld
  handlers:
  - name: reload firewalld
    ansible.builtin.service:
      name: firewalld
      state: reloaded

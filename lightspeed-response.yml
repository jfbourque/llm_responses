- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_service_name: httpd
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_error_log: /var/log/httpd/error_log
  tasks:
  - name: Check and install httpd if not present
    ansible.builtin.package:
      name: httpd
      state: present
  - name: Check httpd configuration
    ansible.builtin.command: httpd -t
    register: httpd_config_check
    failed_when: httpd_config_check.rc != 0
  - name: Check and fix permissions on httpd config file
    ansible.builtin.file:
      path: '{{ httpd_config_file }}'
      owner: root
      group: root
      mode: '0644'
  - name: Check and fix permissions on httpd error log
    ansible.builtin.file:
      path: '{{ httpd_error_log }}'
      owner: root
      group: root
      mode: '0640'
  - name: Enable and start httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  - name: Check httpd service status
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
    register: httpd_service_status
  - name: View latest error messages in httpd error log
    ansible.builtin.command: tail -f "{{ httpd_error_log }}"
    async: 1000
    poll: 0
    become: true
  handlers:
  - name: restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

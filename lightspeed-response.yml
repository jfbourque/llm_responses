- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_module_path: /usr/lib/httpd/modules/mod_module.so
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd module file exists
    ansible.builtin.stat:
      path: '{{ httpd_module_path }}'
    register: module_file_stat
  - name: Remove httpd configuration referencing the missing module
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: LoadModule mod_module
      state: absent
    when: module_file_stat.stat.exists == False
  - name: Install httpd module package if missing
    ansible.builtin.dnf:
      name: httpd-modules
      state: present
    when: module_file_stat.stat.exists == False
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: Restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

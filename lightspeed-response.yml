- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_config_file }}'
    register: httpd_config_file_stat
  - name: Validate httpd configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: InvalidDirectiveHere
      state: absent
    when: httpd_config_file_stat.stat.exists
  - name: Replace invalid directive with a valid one
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      regexp: ^InvalidDirectiveHere
      line: ServerName example.com
    when: httpd_config_file_stat.stat.exists
  - name: Validate httpd configuration
    ansible.builtin.command: httpd -t
    register: httpd_config_validation
    changed_when: false
  - name: Restart httpd service if configuration has changed
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
    when: httpd_config_validation.rc != 0
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

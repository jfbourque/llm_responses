- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    httpd_service: httpd
  tasks:
  - name: Check if httpd.conf file contains the invalid directive
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      state: absent
      line: '{{ invalid_directive }}'
    check_mode: true
    register: remove_invalid_directive
  - name: Validate httpd.conf file syntax
    ansible.builtin.command: httpd -t
    register: httpd_syntax_check
    failed_when: httpd_syntax_check.rc != 0
    check_mode: true
    changed_when: false
  - name: Restart httpd service if config changed
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: restarted
      enabled: true
    when: remove_invalid_directive.changed or httpd_syntax_check.changed
    notify: Wait for httpd service to be available
  - name: Verify httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: started
      enabled: true
    check_mode: true
  handlers:
  - name: Wait for httpd service to be available
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: started
      enabled: true

- name: Remediate httpd service configuration issues
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
    vhost_server_name: example.com
    vhost_server_aliases:
    - www.example.com
    vhost_document_root: /var/www/html
  tasks:
  - name: Remove reference to missing module mod_module.so
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^\s*LoadModule\s+.*mod_module\.so
      state: absent
    notify: Restart httpd
  - name: Comment out stray ServerAlias directives outside <VirtualHost>
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^(\\s*)ServerAlias\\b(.*)$
      line: \\1#ServerAlias\\2
      backrefs: true
      state: present
    notify: Restart httpd
  - name: Ensure proper VirtualHost configuration
    ansible.builtin.blockinfile:
      path: '{{ httpd_conf_path }}'
      marker: '# {mark} ANSIBLE MANAGED VIRTUALHOST {{ vhost_server_name }}'
      block: "<VirtualHost *:80>\n    ServerName {{ vhost_server_name }}\n{% for alias
        in vhost_server_aliases %}\n    ServerAlias {{ alias }}\n{% endfor %}\n    DocumentRoot
        \"{{ vhost_document_root }}\"\n</VirtualHost>\n"
    notify: Restart httpd
  - name: Ensure httpd service is enabled and running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      enabled: true
      state: started
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

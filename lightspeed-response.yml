- name: Remediate httpd service issue on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    options_conf_path: /etc/systemd/system/httpd.service.d/options.conf
    httpd_service_name: httpd
  tasks:
  - name: Correct the httpd.conf file
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '# InvalidDirectiveHere'
      state: absent
    notify: restart httpd
  - name: Review and correct options.conf
    ansible.builtin.lineinfile:
      path: '{{ options_conf_path }}'
      regexp: ^[a-zA-Z]
      line: '# Added by Ansible, ensure correct formatting'
      state: present
    notify: restart httpd
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

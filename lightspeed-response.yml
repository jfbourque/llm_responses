- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    options_conf_path: /etc/systemd/system/httpd.service.d/options.conf
    httpd_service_name: httpd
  tasks:
  - name: Check and correct httpd.conf syntax error
    lineinfile:
      path: '{{ httpd_conf_path }}'
      line: ''
      state: absent
      regexp: ^InvalidDirectiveHere
    notify: restart httpd
  - name: Ensure httpd configuration is valid
    command: httpd -t
    register: httpd_config_test
    changed_when: false
  - name: Investigate and correct options.conf
    lineinfile:
      path: '{{ options_conf_path }}'
      line: ''
      state: absent
      regexp: ^[[:space:]]*InvalidAssignment
    notify: restart httpd
  - name: Ensure httpd service is enabled and started
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

- name: Remediate httpd.service failure on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
  tasks:
  - name: Check if httpd service is running
    ansible.builtin.service_facts:
      services:
      - httpd
    register: service_status
  - name: Gather facts about httpd service
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
    register: httpd_service
  - name: Check httpd configuration for ServerAlias outside VirtualHost
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      regexp: ^ *ServerAlias
      line: ''
      state: absent
      backrefs: true
    notify: restart httpd
  - name: Ensure proper VirtualHost blocks are present
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      regexp: <VirtualHost \*:80>
      line: <VirtualHost *:80>
      state: present
      backrefs: false
    notify: restart httpd
  - name: Move ServerAlias directive inside VirtualHost block
    ansible.builtin.blockinfile:
      path: '{{ httpd_config_file }}'
      block: 'ServerAlias example.com

        '
      insertafter: <VirtualHost *:80>
      state: present
    notify: restart httpd
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted
      enabled: true
  - name: Ensure httpd service is started and enabled
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true

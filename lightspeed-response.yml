- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    override_conf_path: /etc/systemd/system/httpd.service.d/override.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if override.conf exists and correct its content
    ansible.builtin.file:
      path: '{{ override_conf_path }}'
      state: file
    register: override_conf_file
  - name: Correct override.conf content
    ansible.builtin.replace:
      path: '{{ override_conf_path }}'
      regexp: ^(?!\[Service\]).*
      replace: ''
      backup: true
    when: override_conf_file.path is defined and override_conf_file.state == 'file'
  - name: Add corrected [Service] section and directives to override.conf
    ansible.builtin.lineinfile:
      path: '{{ override_conf_path }}'
      line: '[Service]'
      state: present
    when: override_conf_file.path is defined and override_conf_file.state == 'file'
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: reloaded
  - name: Ensure httpd service is started and enabled
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  - name: Verify httpd service status
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: started
    register: httpd_status
  handlers:
  - name: restart httpd
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: restarted

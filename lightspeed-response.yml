- name: Remediate httpd service failure on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_package: httpd
    httpd_service: httpd
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    erroneous_module_regex: ^LoadModule\s+.*mod_module\.so
    httpd_modules_dir: /usr/lib/httpd/modules
    missing_module: mod_module.so
  tasks:
  - name: Ensure the httpd package is installed
    ansible.builtin.yum:
      name: '{{ httpd_package }}'
      state: present
  - name: Remove erroneous LoadModule line for {{ missing_module }} from httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: '{{ erroneous_module_regex }}'
      state: absent
      backrefs: false
    notify: Restart httpd
  - name: Verify that the required modules directory exists
    ansible.builtin.file:
      path: '{{ httpd_modules_dir }}'
      state: directory
      mode: '0755'
  - name: Ensure httpd service is enabled and started
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: started
      enabled: true
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: restarted

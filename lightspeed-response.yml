- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_config_file }}'
    register: config_file_stat
  - name: Fail if httpd configuration file does not exist
    ansible.builtin.fail:
      msg: httpd configuration file {{ httpd_config_file }} does not exist
    when: not config_file_stat.stat.exists
  - name: Validate httpd.conf syntax
    ansible.builtin.command:
      cmd: apachectl configtest
    register: configtest_result
    changed_when: false
  - name: Fail if configuration is invalid
    ansible.builtin.fail:
      msg: 'Apache configuration is invalid: {{ configtest_result.stdout }}'
    when: configtest_result.rc != 0
  - name: Ensure httpd configuration is correct
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: '# Correct invalid directive here'
      regexp: ^InvalidDirectiveHere
      state: absent
    notify: restart httpd
  - name: Ensure OPTIONS environment variable is set
    ansible.builtin.lineinfile:
      path: /etc/sysconfig/httpd
      line: OPTIONS="-a -b"
      regexp: ^OPTIONS
      state: present
    notify: restart httpd
  - name: Enable and start httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

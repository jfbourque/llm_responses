- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    override_conf_file: /etc/systemd/system/httpd.service.d/override.conf
  tasks:
  - name: Correct the Apache configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: '# InvalidDirectiveHere'
      state: absent
    notify: restart httpd
  - name: Verify and correct the override file
    ansible.builtin.copy:
      content: ''
      dest: '{{ override_conf_file }}'
      mode: '0644'
    when: '{{ override_conf_file }} is file and not (lookup(''file'', override_conf_file)
      | regex_replace(''\s+'', '''') | regex_replace(''^\[.*\]$'', '''') | length
      > 0)'
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      name: httpd
      state: reloaded
  - name: Ensure httpd service is running and enabled
    ansible.builtin.systemd:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.systemd:
      name: httpd
      state: restarted

- name: Remediate httpd service issue on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    correct_directive: ServerAlias
  tasks:
  - name: Check if httpd_conf_path exists
    ansible.builtin.file:
      path: '{{ httpd_conf_path }}'
      state: file
    register: httpd_conf_file
  - name: Read httpd.conf file
    ansible.builtin.command: cat "{{ httpd_conf_path }}"
    register: httpd_conf_content
    when: httpd_conf_file.stat.exists
  - name: Correct invalid directive in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^.*{{ invalid_directive }}.*$
      line: '{{ correct_directive }}'
      state: present
    notify: restart httpd
  - name: Ensure httpd service is started and enabled
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

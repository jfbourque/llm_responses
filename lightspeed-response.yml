- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd service is running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
    register: service_status
    ignore_errors: true
  - name: Check and fix httpd configuration
    ansible.builtin.command: httpd -t
    register: config_check
    ignore_errors: true
  - name: Check journal logs for httpd errors
    ansible.builtin.command: journalctl -u "{{ httpd_service_name }}"
    become: true
    register: journal_logs
  - name: Restart httpd service if configuration is invalid
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
    when: config_check.rc != 0
  - name: Ensure httpd service is started and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

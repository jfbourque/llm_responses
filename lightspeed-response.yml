- name: Remediate Apache httpd service failure on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    apache_conf_dir: /etc/httpd/conf.d
    apache_main_conf: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
  tasks:
  - name: Find Apache configuration files
    ansible.builtin.find:
      paths: '{{ apache_conf_dir }}'
      patterns: '*.conf'
      recurse: true
    register: conf_files
  - name: Remove invalid directive from main configuration
    ansible.builtin.lineinfile:
      path: '{{ apache_main_conf }}'
      regexp: ^\\s*{{ invalid_directive }}\\b.*$
      state: absent
      backup: true
    notify: Restart httpd
  - name: Remove invalid directive from additional configuration files
    ansible.builtin.lineinfile:
      path: '{{ item.path }}'
      regexp: ^\\s*{{ invalid_directive }}\\b.*$
      state: absent
      backup: true
    loop: '{{ conf_files.files }}'
    notify: Restart httpd
  - name: Ensure httpd service is enabled and started
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

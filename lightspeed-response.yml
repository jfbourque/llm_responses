- name: Remediate httpd service issue on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    corrected_directive: '# Correct directive here'
  tasks:
  - name: Replace invalid directive in httpd.conf
    ansible.builtin.replace:
      path: '{{ httpd_conf_path }}'
      regexp: '{{ invalid_directive }}'
      replace: '{{ corrected_directive }}'
    notify: restart httpd
  - name: Ensure httpd service is started and enabled
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

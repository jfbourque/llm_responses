- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    httpd_service: httpd
  tasks:
  - name: Correct syntax error in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '# {{ invalid_directive }} # Removed invalid directive'
      regexp: ^.*{{ invalid_directive }}.*$
      state: present
    notify: restart httpd
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: restarted

- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_error_log: /var/log/httpd/error_log
    httpd_service: httpd
  tasks:
  - name: Check and correct httpd configuration syntax errors
    command: httpd -t
    register: httpd_config_test
    failed_when: httpd_config_test.rc != 0
    changed_when: false
  - name: Check for error messages in /var/log/httpd/error_log
    command: grep -E 'error|exception' "{{ httpd_error_log }}"
    register: httpd_error_messages
    changed_when: false
  - name: Check if httpd service is running
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: started
      enabled: true
    register: httpd_service_status
  - name: Restart httpd service if it's not running
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: restarted
      enabled: true
    when: httpd_service_status is changed or httpd_config_test.rc != 0
  - name: Check journal logs with elevated privileges
    ansible.builtin.command: journalctl -u "{{ httpd_service }}"
    register: journal_logs
    changed_when: false
  handlers:
  - name: restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: restarted
      enabled: true

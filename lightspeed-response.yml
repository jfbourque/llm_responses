- name: Remediate Apache httpd service failure
  hosts: all
  become: true
  vars:
    apache_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
  tasks:
  - name: Remove invalid Apache directive if present
    ansible.builtin.lineinfile:
      path: '{{ apache_conf_path }}'
      regexp: ^[ \t]*{{ invalid_directive }}\b
      state: absent
    notify: Restart httpd
  - name: Ensure httpd service is enabled and running
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

- name: Remediate httpd service on the problematic host
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
    missing_module_name: mod_module.so
    missing_module_path: /usr/lib/httpd/modules/{{ missing_module_name }}
    httpd_package: httpd
    httpd_modules_package: httpd
  tasks:
  - name: Ensure core httpd package is installed
    ansible.builtin.package:
      name: '{{ httpd_package }}'
      state: present
  - name: Verify the missing module file
    ansible.builtin.stat:
      path: '{{ missing_module_path }}'
    register: missing_module_stat
  - name: Install package that provides the missing module (if needed)
    ansible.builtin.package:
      name: '{{ httpd_modules_package }}'
      state: present
    when: not missing_module_stat.stat.exists
  - name: Comment out the LoadModule line for the missing module
    ansible.builtin.replace:
      path: '{{ httpd_conf_path }}'
      regexp: ^\s*LoadModule\s+{{ missing_module_name | regex_escape }}\s+{{ missing_module_path
        | regex_escape }}\s*$
      replace: '# LoadModule {{ missing_module_name }} {{ missing_module_path }}  #
        disabled by Ansible remediation'
    notify: Restart httpd
  - name: Ensure httpd service is enabled and running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      enabled: true
      state: started
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

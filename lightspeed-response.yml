- name: Ansible schoolhttpd
  hosts: all
  become: true
  tasks:
  - name: Remove line containing InvalidDirectiveHere
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      state: absent
      regexp: ^InvalidDirectiveHere
  - name: Restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

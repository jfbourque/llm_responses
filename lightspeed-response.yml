- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    override_conf_path: /etc/systemd/system/httpd.service.d/override.conf
  tasks:
  - name: Correct syntax error in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '# Corrected directive, example: Listen 80'
      insertafter: ^(Listen).*
      backrefs: true
      state: present
    notify: restart httpd
  - name: Fix override.conf file
    ansible.builtin.ini_file:
      path: '{{ override_conf_path }}'
      section: Service
      option: ExecStart
      value: ''
      state: present
  - name: Ensure httpd service is enabled and running
    ansible.builtin.systemd_service:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.systemd_service:
      name: httpd
      state: restarted

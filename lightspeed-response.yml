- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Correct invalid directive in httpd.conf
    ansible.builtin.replace:
      path: '{{ httpd_conf_path }}'
      regexp: ^InvalidDirectiveHere
      replace: ''
  - name: Validate httpd configuration file syntax
    ansible.builtin.command: httpd -t
    register: httpd_config_test
    failed_when: '''Syntax OK'' not in stdout'
  - name: Restart httpd service if config has changed
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
    when: httpd_config_test is changed
    listen: restart httpd
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

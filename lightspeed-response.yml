- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Correct the configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: '# InvalidDirectiveHere'
      state: present
      create: false
  - name: Remove invalid directive from configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      regexp: ^InvalidDirectiveHere
      line: '#InvalidDirectiveHere'
      state: present
      backrefs: true
  - name: Ensure httpd service is configured to start on boot
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      enabled: true
      state: enabled
  - name: Restart httpd service if configuration has changed
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
      daemon_reload: true
    notify: restart httpd
  - name: Verify httpd service is running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

- name: Remediate httpd service issue on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    module_name: mod_module.so
    module_path: /usr/lib/httpd/modules
    module_full_path: '{{ module_path }}/{{ module_name }}'
    httpd_pkg: httpd
    module_pkg: httpd-mod_module
    httpd_service_name: httpd
  tasks:
  - name: Ensure the httpd package is installed
    ansible.builtin.yum:
      name: '{{ httpd_pkg }}'
      state: present
  - name: Check whether the required module file exists
    ansible.builtin.stat:
      path: '{{ module_full_path }}'
    register: module_stat
  - name: Install package that provides the missing module (if needed)
    ansible.builtin.yum:
      name: '{{ module_pkg }}'
      state: present
    when: not module_stat.stat.exists
  - name: Ensure the LoadModule directive for the missing module is commented out
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^\s*LoadModule\s+{{ module_name }}\s+.*$
      state: absent
      backrefs: true
    notify: Restart httpd
  - name: Verify httpd service is enabled and started
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      enabled: true
      state: started
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

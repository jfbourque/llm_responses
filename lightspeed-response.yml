- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Correct syntax error in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: '# InvalidDirectiveHere'
      state: absent
    notify: restart httpd
  - name: Validate httpd configuration file
    ansible.builtin.command: httpd -t
    register: httpd_config_test
    changed_when: false
  - name: Ensure httpd service is restarted if config test fails
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
    when: httpd_config_test.rc != 0
    notify: restart httpd
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

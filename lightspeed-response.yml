- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    override_conf_path: /etc/systemd/system/httpd.service.d/override.conf
  tasks:
  - name: Correct syntax error in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '# InvalidDirectiveHere'
      state: absent
    notify: restart httpd
  - name: Remove or correct override.conf
    ansible.builtin.file:
      path: '{{ override_conf_path }}'
      state: absent
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      name: httpd
      state: reloaded
  - name: Ensure httpd service is running and enabled
    ansible.builtin.systemd:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.systemd:
      name: httpd
      state: restarted

- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
    options_variable: OPTIONS
    options_value: -c /etc/httpd/conf/httpd.conf
  tasks:
  - name: Correct syntax error in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      state: absent
      line: InvalidDirectiveHere
      backup: true
  - name: Define OPTIONS environment variable in httpd.service
    ansible.builtin.lineinfile:
      path: /usr/lib/systemd/system/httpd.service
      state: present
      line: Environment={{ options_variable }}={{ options_value }}
      regexp: ^Environment=.*$
      backrefs: true
      backup: true
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: reloaded
  - name: Restart httpd service if needed
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
      loop: '{{ ansible_play_hosts }}'
      when: '''InvalidDirectiveHere'' in ansible.builtin.slurp(path=httpd_conf_path).content'
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

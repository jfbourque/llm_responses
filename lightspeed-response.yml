- name: Remediate httpd service configuration issues
  hosts: all
  gather_facts: true
  tasks:
  - name: Notify about httpd.conf syntax error
    ansible.builtin.debug:
      msg: Apache configuration error detected in /etc/httpd/conf/httpd.conf at line
        35. Check for invalid directive 'InvalidDirectiveHere'.
    vars:
      notification_type: error
  - name: Set OPTIONS environment variable in httpd service file
    ansible.builtin.replace:
      path: /etc/systemd/system/httpd.service
      regexp: ^OPTIONS=.*
      replace: OPTIONS="-DFOREGROUND"
      backup: true
      validate_on_diff: true
    notify: restart_httpd
  - name: Ensure override.conf is properly formatted
    ansible.builtin.template:
      src: override.conf.j2
      dest: /etc/systemd/system/httpd.service.d/override.conf
      mode: 420
    notify: restart_httpd
  handlers:
  - name: restart_httpd
    ansible.builtin.systemd:
      name: httpd
      state: restarted
      enabled: true
      daemon_reload: true
  post_tasks:
  - name: Verify httpd service status
    ansible.builtin.systemd:
      name: httpd
      state: started
      enabled: true
      register: httpd_status
    assert:
      that:
      - httpd_status.status == "running"
      - httpd_status.enabled == "yes"

- name: Remediate httpd service issue on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    options_conf_path: /etc/systemd/system/httpd.service.d/options.conf
  tasks:
  - name: Correct syntax error in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '# InvalidDirectiveHere'
      state: absent
      backrefs: true
  - name: Correct misconfiguration in options.conf
    ansible.builtin.replace:
      path: '{{ options_conf_path }}'
      regexp: ^Assignment\s*=\s*value
      replace: '[Service]\nAssignment=value'
  - name: Ensure httpd service configuration is correct
    ansible.builtin.file:
      path: '{{ options_conf_path }}'
      state: present
      mode: '0644'
  - name: Reload systemd daemon
    ansible.builtin.systemd:
      name: httpd
      state: reloaded
  handlers:
  - name: Restart httpd service
    ansible.builtin.service:
      name: httpd
      state: restarted
      enabled: true
  - name: Verify httpd service status
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  post_tasks:
  - name: Check httpd service status
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true

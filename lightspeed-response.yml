- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    httpd_service: httpd
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_conf_path }}'
    register: httpd_conf_file
  - name: Correct invalid directive in httpd configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '#{{ invalid_directive }}'
      state: present
      create: true
    when: httpd_conf_file.stat.exists and httpd_conf_file.stat.is_file
  - name: Ensure httpd service is started and enabled
    ansible.builtin.systemd_service:
      name: '{{ httpd_service }}'
      state: started
      enabled: true
  - name: Validate httpd service status
    ansible.builtin.systemd_service:
      name: '{{ httpd_service }}'
      state: started
      enabled: true
    register: httpd_service_status
  - name: Report httpd service status
    ansible.builtin.debug:
      msg: 'httpd service status: {{ httpd_service_status }}'

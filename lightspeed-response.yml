- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd.conf exists
    ansible.builtin.stat:
      path: '{{ httpd_conf_path }}'
    register: httpd_conf_stat
  - name: Correct syntax error in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '# {{ invalid_directive }} (removed by Ansible)'
      regexp: ^{{ invalid_directive }}
      state: absent
    when: httpd_conf_stat.stat.exists
  - name: Validate httpd configuration
    ansible.builtin.command: httpd -t
    register: httpd_config_test
    changed_when: false
  - name: Restart httpd service if configuration is valid
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
    when: httpd_config_test.rc == 0
  - name: Verify httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
    register: httpd_service_status
  - name: Handle httpd service restart
    ansible.builtin.debug:
      msg: httpd service restarted
    when: httpd_service_status.changed
  handlers:
  - name: Restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true

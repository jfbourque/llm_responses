- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_service_file: /usr/lib/systemd/system/httpd.service
    override_conf_file: /etc/httpd/conf.d/override.conf
    httpd_service_name: httpd
  tasks:
  - name: Set OPTIONS environment variable in httpd.service
    ansible.builtin.lineinfile:
      path: '{{ httpd_service_file }}'
      line: Environment=OPTIONS="-DFOREGROUND"
      state: present
    notify: restart httpd service
  - name: Correct malformed override configuration
    ansible.builtin.lineinfile:
      path: '{{ override_conf_file }}'
      line: ''
      state: absent
      regexp: ^[A-Za-z]+=
    notify: restart httpd service
  - name: Ensure httpd service is running and enabled
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd service
    ansible.builtin.systemd:
      name: '{{ httpd_service_name }}'
      state: restarted

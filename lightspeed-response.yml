- name: Remediate httpd service issues on RHEL server
  hosts: all
  become: true
  vars:
    httpd_service_name: httpd
    httpd_config_file: /etc/httpd/conf/httpd.conf
    server_name: arduino.jfbourque.ca
    options_value: ''
  tasks:
  - name: Set OPTIONS environment variable
    ansible.builtin.lineinfile:
      path: /etc/systemd/system/httpd.service.d/override.conf
      line: OPTIONS={{ options_value }}
      state: present
      create: true
    notify: restart httpd
  - name: Configure ServerName directive
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: ServerName {{ server_name }}
      state: present
    notify: restart httpd
  - name: Ensure httpd service is enabled and running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_config_file }}'
    register: httpd_config_file_stat
  - name: Correct or remove invalid directive in httpd configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: InvalidDirectiveHere
      state: absent
    when: httpd_config_file_stat.stat.exists
  - name: Validate httpd configuration file syntax
    ansible.builtin.command: httpd -t
    register: httpd_config_syntax_check
    changed_when: false
  - name: Restart httpd service if configuration file syntax is valid
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
    when: httpd_config_syntax_check.rc == 0
  - name: Verify httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
    register: httpd_service_status
  - name: Handle httpd service restart
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
    when: httpd_service_status.changed
  handlers:
  - name: Restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

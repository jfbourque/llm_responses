- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_service_name: httpd
    dbus_service_name: dbus
    systemd_service_name: systemd
  tasks:
  - name: Check if systemd is running
    ansible.builtin.service:
      name: '{{ systemd_service_name }}'
      state: started
      enabled: true
  - name: Verify and restart dbus
    ansible.builtin.service:
      name: '{{ dbus_service_name }}'
      state: restarted
      enabled: true
  - name: Reboot the system if necessary
    ansible.builtin.reboot:
      msg: Rebooting to ensure a clean start
      connect_timeout: 5
      reboot_timeout: 300
      pre_reboot_delay: 0
      post_reboot_delay: 60
      test_command: uptime
  - name: Check if httpd service is running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  - name: Verify httpd service status
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
    register: httpd_status
  - name: Check and restart httpd if it's not running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
    when: httpd_status.status != "started"
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true

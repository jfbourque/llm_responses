- name: Remediate Apache invalid directive and ensure service is running
  hosts: all
  become: true
  vars:
    apache_service_name: httpd
    apache_config_root: /etc/httpd
    invalid_directive: InvalidDirectiveHere
    directive_regex: ^(\s*){{ invalid_directive }}\b
    directive_comment: \1# {{ invalid_directive }}
  tasks:
  - name: Locate configuration files containing the invalid directive
    ansible.builtin.command: 'grep -rl "{{ invalid_directive }}" "{{ apache_config_root
      }}"

      '
    register: grep_result
    changed_when: false
    ignore_errors: true
  - name: Record files with invalid directive
    ansible.builtin.set_fact:
      files_with_invalid_directive: '{{ grep_result.stdout_lines | default([]) }}'
  - name: Comment out the invalid directive in each affected file
    ansible.builtin.replace:
      path: '{{ item }}'
      regexp: '{{ directive_regex }}'
      replace: '{{ directive_comment }}'
      backup: true
    loop: '{{ files_with_invalid_directive }}'
    when: files_with_invalid_directive | length > 0
    notify: Restart Apache service
  - name: Ensure Apache service is enabled and started
    ansible.builtin.service:
      name: '{{ apache_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: Restart Apache service
    ansible.builtin.service:
      name: '{{ apache_service_name }}'
      state: restarted

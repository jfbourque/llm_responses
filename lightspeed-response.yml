- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    httpd_service: httpd
  tasks:
  - name: Check if httpd.conf exists
    ansible.builtin.stat:
      path: '{{ httpd_conf_path }}'
    register: httpd_conf_stat
  - name: Check for invalid directive in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      state: absent
      line: '{{ invalid_directive }}'
    when: httpd_conf_stat.stat.exists
  - name: Validate httpd configuration
    ansible.builtin.command: httpd -t
    register: httpd_config_validation
    changed_when: false
  - name: Restart httpd service if configuration has changed
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: restarted
    when: httpd_config_validation.rc != 0
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: restarted

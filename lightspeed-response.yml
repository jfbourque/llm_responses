- name: Remediate httpd service issue
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive_line: 35
    invalid_directive: InvalidDirectiveHere
  tasks:
  - name: Check if httpd.conf exists
    ansible.builtin.stat:
      path: '{{ httpd_conf_path }}'
    register: httpd_conf_stat
  - name: Remove invalid directive from httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '{{ invalid_directive }}'
      state: absent
      backup: true
    when: httpd_conf_stat.stat.exists
  - name: Ensure httpd service is restarted if config changed
    ansible.builtin.service:
      name: httpd
      state: restarted
    notify: enable and start httpd service
  handlers:
  - name: enable and start httpd service
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true

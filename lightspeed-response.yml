- name: Remediate httpd service issue on RHEL
  hosts: all
  gather_facts: true
  vars:
    httpd_service_file: /usr/lib/systemd/system/httpd.service
  tasks:
  - name: Update httpd service file to handle OPTIONS variable
    ansible.builtin.replace:
      path: '{{ httpd_service_file }}'
      regexp: ^ExecStart=.*OPTIONS
      replace: ExecStart=/usr/sbin/httpd $OPTIONS
  - name: Reload systemd to apply changes
    ansible.builtin.systemd:
      daemon_reload: true
  - name: Start and enable httpd service
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  - name: Verify httpd service status
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: Restart httpd after config changes
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
      trigger:
      - changed: true

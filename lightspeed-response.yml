- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    config_file: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    log_level: debug
  tasks:
  - name: Check if httpd service is running
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
    register: httpd_service_status
    ignore_errors: true
  - name: Check configuration file for errors
    ansible.builtin.lineinfile:
      path: '{{ config_file }}'
      line: '# {{ invalid_directive }} (removed by Ansible)'
      state: absent
      backrefs: true
    notify: restart httpd
  - name: Validate configuration file syntax
    ansible.builtin.command:
      cmd: httpd -t
    register: config_validation
    failed_when: '''Syntax OK'' not in config_validation.stdout'
  - name: Set APACHE_LOG_LEVEL to debug for detailed logging
    ansible.builtin.environment:
      name: APACHE_LOG_LEVEL
      value: '{{ log_level }}'
      state: present
    notify: restart httpd
  - name: Ensure LogLevel is set to debug in configuration file
    ansible.builtin.lineinfile:
      path: '{{ config_file }}'
      regexp: ^LogLevel
      line: LogLevel {{ log_level }}
      backrefs: true
    notify: restart httpd
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted
      enabled: true

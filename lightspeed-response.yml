- name: Remediate httpd service issue
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    options_variable: OPTIONS=-DFOREGROUND
  tasks:
  - name: Check and correct the httpd.conf file
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      state: absent
      line: '{{ invalid_directive }}'
    notify: restart httpd
  - name: Set the OPTIONS environment variable
    ansible.builtin.lineinfile:
      path: /etc/systemd/system/httpd.service.d/options.conf
      state: present
      line: Environment={{ options_variable }}
      create: true
    notify: restart httpd
  - name: Ensure httpd service is running and enabled
    ansible.builtin.systemd:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.systemd:
      name: httpd
      state: restarted

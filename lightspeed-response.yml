- name: Remediate httpd service issue on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
    httpd_service: httpd
  tasks:
  - name: Check if httpd.conf file contains the invalid directive
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      state: present
      line: '{{ invalid_directive }}'
    register: invalid_directive_present
    failed_when: false
  - name: Remove the invalid directive from httpd.conf file
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      state: absent
      line: '{{ invalid_directive }}'
    when: invalid_directive_present.found > 0
  - name: Ensure httpd service is restarted if config changes were made
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: restarted
      enabled: true
    when: invalid_directive_present.found > 0
    notify: restart httpd
  - name: Verify httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service }}'
      state: restarted
      enabled: true

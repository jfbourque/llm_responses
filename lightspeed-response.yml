- name: Simplified playbook to configure a host
  hosts: all
  become: true
  tasks:
  - name: Remove anicios InvalidDirectiveHere
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      regexp: ^InvalidDirectiveHere
      state: absent
  - name: Restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

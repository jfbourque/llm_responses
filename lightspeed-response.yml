- name: Remediate httpd service issue
  hosts: all
  become: true
  vars:
    httpd_service_name: httpd
    httpd_service_file: /usr/lib/systemd/system/httpd.service
    httpd_options: -c /etc/httpd/conf/httpd.conf
  tasks:
  - name: Check if httpd service file exists
    ansible.builtin.stat:
      path: '{{ httpd_service_file }}'
    register: httpd_service_file_stat
  - name: Ensure httpd service file has correct Environment directive
    ansible.builtin.lineinfile:
      path: '{{ httpd_service_file }}'
      line: Environment=OPTIONS={{ httpd_options }}
      state: present
      create: true
    when: httpd_service_file_stat.stat.exists
    notify: restart httpd service
  - name: Ensure httpd service is enabled and running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd.conf exists
    ansible.builtin.stat:
      path: '{{ httpd_conf_path }}'
    register: httpd_conf_stat
  - name: Correct invalid directive in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '# InvalidDirectiveHere'
      state: present
      create: true
    when: httpd_conf_stat.stat.exists
  - name: Validate httpd.conf syntax
    ansible.builtin.command: httpd -t
    register: httpd_syntax_check
    changed_when: false
  - name: Restart httpd service if config is corrected
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
    when: httpd_syntax_check.rc == 0 and httpd_conf_stat.stat.exists
  - name: Verify httpd service status
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true

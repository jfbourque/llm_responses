- name: Remediate httpd service issue
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    correct_httpd_conf_path: /path/to/correct/httpd.conf
  tasks:
  - name: Check if httpd.conf file exists
    ansible.builtin.stat:
      path: '{{ httpd_conf_path }}'
    register: httpd_conf_file
  - name: Correct httpd.conf file
    ansible.builtin.copy:
      content: '{{ lookup(''file'', correct_httpd_conf_path) }}'
      dest: '{{ httpd_conf_path }}'
      mode: '0644'
    when: httpd_conf_file.stat.exists
    notify: restart httpd
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted
      enabled: true

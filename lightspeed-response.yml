- name: apache restart
  hosts: all
  become: true
  tasks:
  - name: Remove line that contains InvalidDirectiveHere
    ansible.builtin.lineinfile:
      path: /etc/httpd/conf/httpd.conf
      state: absent
      regexp: ^InvalidDirectiveHere$
  - name: restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

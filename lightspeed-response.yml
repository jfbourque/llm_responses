- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd.conf file exists
    ansible.builtin.stat:
      path: '{{ httpd_conf_path }}'
    register: httpd_conf_file
  - name: Validate httpd.conf file syntax
    ansible.builtin.command:
      cmd: httpd -t
    register: httpd_syntax_check
    failed_when: httpd_syntax_check.rc != 0
    changed_when: false
    become: true
  - name: Correct invalid directive in httpd.conf file
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      line: '#InvalidDirectiveHere'
      regexp: ^InvalidDirectiveHere
      state: present
    notify: restart httpd service
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

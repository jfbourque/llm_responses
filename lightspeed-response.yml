- name: Remediate Apache HTTPD service failure on web server
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    invalid_directive: InvalidDirectiveHere
  tasks:
  - name: Remove invalid Apache directive from configuration
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^[ \t]*{{ invalid_directive }}\b.*$
      state: absent
    notify: Restart httpd
  - name: Ensure httpd service is enabled and started
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

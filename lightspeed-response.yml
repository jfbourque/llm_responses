- name: Correct httpd configuration and restart service
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Correct httpd.conf syntax error
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: ^InvalidDirectiveHere
      line: '# InvalidDirectiveHere'
      state: present
    notify: restart httpd
  - name: Ensure httpd service is running and enabled
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted

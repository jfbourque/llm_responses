- name: Remediate httpd service failure on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    missing_module: mod_module.so
    module_load_regex: ^LoadModule\s+\w+\s+modules/{{ missing_module }}
  tasks:
  - name: Ensure the httpd package is installed
    ansible.builtin.yum:
      name: httpd
      state: present
  - name: Remove (or comment out) the LoadModule line for the missing module
    ansible.builtin.lineinfile:
      path: '{{ httpd_conf_path }}'
      regexp: '{{ module_load_regex }}'
      state: absent
      backup: true
    notify: Restart httpd
  - name: Ensure httpd service is enabled and started
    ansible.builtin.service:
      name: httpd
      state: started
      enabled: true
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: httpd
      state: restarted

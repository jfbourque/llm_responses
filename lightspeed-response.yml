- name: Remediate httpd service issues on RHEL server
  hosts: all
  gather_facts: true
  vars:
    server_name: arduino.jfbourque.ca
  tasks:
  - name: Ensure httpd service has OPTIONS environment variable set
    ansible.builtin.systemd_edit:
      name: httpd
      state: present
      content: '[Service]

        Environment="OPTIONS="

        '
    changed_when: false
  - name: Add ServerName directive to Apache configuration
    ansible.builtin.replace:
      path: /etc/httpd/conf/httpd.conf
      after: ^# ServerName
      before: ^# ServerName
      state: present
      regexp: ^ServerName.*
      replace: ServerName {{ server_name }}
      backup: true
    changed_when: false
  - name: Reload httpd service configuration
    ansible.builtin.systemd:
      name: httpd
      state: restarted
      args:
      - reload
    notify: httpd_reload_handler
  - name: Verify httpd service is running
    ansible.builtin.systemd:
      name: httpd
      state: started
      changed_when: false
  - name: Verify httpd service is enabled
    ansible.builtin.systemd:
      name: httpd
      state: enabled
      changed_when: false
  handlers:
  - name: httpd_reload_handler
    ansible.builtin.systemd:
      name: httpd
      state: restarted
      args:
      - reload

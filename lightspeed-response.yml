- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
    server_name: arduino.jfbourque.ca
  tasks:
  - name: Check if httpd service is running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
    register: service_status
    ignore_errors: true
  - name: Stop httpd service if it's running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: stopped
    when: service_status is defined and service_status.state == "started"
  - name: Check Apache configuration syntax
    ansible.builtin.command:
      cmd: apachectl configtest
    register: config_test
    changed_when: false
  - name: Correct invalid directive in httpd.conf
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: '# InvalidDirectiveHere'
      state: absent
    notify: reload httpd service
  - name: Set ServerName directive
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      line: ServerName {{ server_name }}
      state: present
    notify: reload httpd service
  - name: Ensure httpd service is enabled and started
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: reload httpd service
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: reloaded

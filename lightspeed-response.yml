- name: Remedy httpd.service issues on the affected host
  hosts: all
  become: true
  vars:
    httpd_service_name: httpd
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    httpd_port: 80
    firewall_service: http
  tasks:
  - name: Verify httpd configuration syntax
    ansible.builtin.command: /usr/sbin/httpd -t
    register: httpd_config_test
    changed_when: false
    failed_when: httpd_config_test.rc != 0
    tags: config_test
  - name: Ensure firewalld is installed
    ansible.builtin.package:
      name: firewalld
      state: present
  - name: Ensure firewalld service is running and enabled
    ansible.builtin.service:
      name: firewalld
      state: started
      enabled: true
  - name: Open HTTP port in the firewall
    ansible.builtin.firewalld:
      service: '{{ firewall_service }}'
      permanent: true
      state: enabled
      immediate: true
    notify: Reload firewalld
  - name: Ensure httpd package is installed
    ansible.builtin.package:
      name: httpd
      state: present
  - name: Deploy a validated httpd configuration file
    ansible.builtin.template:
      src: httpd.conf.j2
      dest: '{{ httpd_conf_path }}'
      owner: root
      group: root
      mode: '0644'
    notify: Restart httpd
  - name: Ensure httpd service is enabled and started
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: Restart httpd
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
  - name: Reload firewalld
    ansible.builtin.service:
      name: firewalld
      state: reloaded

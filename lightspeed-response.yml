- name: Remediate httpd service issue on RHEL server
  hosts: all
  become: true
  vars:
    httpd_config_file: /etc/httpd/conf/httpd.conf
    httpd_service_name: httpd
  tasks:
  - name: Check if httpd configuration file exists
    ansible.builtin.stat:
      path: '{{ httpd_config_file }}'
    register: httpd_config_file_stat
  - name: Validate httpd configuration file syntax
    ansible.builtin.command:
      cmd: httpd -t
      warn: false
    register: httpd_config_validation
    failed_when: httpd_config_validation.rc != 0
    changed_when: false
    become: true
  - name: Find and remove invalid directive from httpd configuration file
    ansible.builtin.lineinfile:
      path: '{{ httpd_config_file }}'
      state: absent
      line: ^InvalidDirectiveHere
      backup: true
    register: httpd_config_update
  - name: Restart httpd service if configuration file was updated
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
      enabled: true
    when: httpd_config_update is changed
    notify: Check httpd service status
  handlers:
  - name: Check httpd service status
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true

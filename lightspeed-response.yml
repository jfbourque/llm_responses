- name: Remediate httpd.service failure on web.sandbox5146.opentlc.com
  hosts: all
  become: true
  vars:
    httpd_conf_path: /etc/httpd/conf/httpd.conf
    serveralias_pattern: ^\\s*ServerAlias\\b
    httpd_service_name: httpd
  tasks:
  - name: Ensure any stray ServerAlias directives are commented out
    ansible.builtin.replace:
      path: '{{ httpd_conf_path }}'
      regexp: '{{ serveralias_pattern }}'
      replace: '# \0'
      backup: true
    notify: Restart {{ httpd_service_name }}
  - name: Ensure the httpd service is enabled and running
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: started
      enabled: true
  handlers:
  - name: Restart {{ httpd_service_name }}
    ansible.builtin.service:
      name: '{{ httpd_service_name }}'
      state: restarted
